name: check

on:
  push:
  schedule:
  - cron: '13 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - run: |
        set -euo pipefail

        url-test(){
          local body
          body=$(curl --fail --max-time 30 --retry 3 --retry-delay 10 --silent --show-error "$1")
          for expected in "${@:2}"; do
            fgrep -- "$expected" <<< "$body"
          done
        }

        url-test https://ivan-kuchin.gitlab.io/holidays.ics/ de-hh Hamburg
        url-test https://ivan-kuchin.gitlab.io/holidays.ics/de_hh.ics 'Tag der Deutschen Einheit'
